---
apiVersion: v1
kind: Namespace
metadata:
  name: central-services
  labels:
    name: central-services
    project: nova

---
apiVersion: v1
kind: Secret
metadata:
  name: azdo-mcp-secret
  namespace: central-services
type: Opaque
stringData:
  # IMPORTANT: Replace these values before deploying
  # Generate PAT at: https://dev.azure.com/distelsa/_usersSettings/tokens
  azure-devops-pat: "YOUR_AZURE_DEVOPS_PAT_HERE"
  # Generate API key: openssl rand -base64 32
  mcp-api-key: "YOUR_RANDOM_API_KEY_HERE"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: azdo-mcp-config
  namespace: central-services
  labels:
    app: azdo-mcp-wrapper
    project: nova
data:
  AZURE_DEVOPS_ORG: "distelsa"
  AZURE_DEVOPS_DEFAULT_PROJECT: "Nova"
  AZURE_DEVOPS_ORG_URL: "https://dev.azure.com/distelsa"
  PORT: "3000"
  NODE_ENV: "production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azdo-mcp-wrapper
  namespace: central-services
  labels:
    app: azdo-mcp-wrapper
    project: nova
    component: mcp-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: azdo-mcp-wrapper
  template:
    metadata:
      labels:
        app: azdo-mcp-wrapper
        project: nova
        component: mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      containers:
        - name: mcp-wrapper
          # IMPORTANT: Replace with your ECR repository
          image: YOUR_AWS_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/nova/azdo-mcp-wrapper:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: azdo-mcp-config
          env:
            - name: AZURE_DEVOPS_PAT
              valueFrom:
                secretKeyRef:
                  name: azdo-mcp-secret
                  key: azure-devops-pat
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: azdo-mcp-secret
                  key: mcp-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      terminationGracePeriodSeconds: 30
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: azdo-mcp-wrapper
  namespace: central-services
  labels:
    app: azdo-mcp-wrapper
    project: nova
spec:
  selector:
    app: azdo-mcp-wrapper
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP
  sessionAffinity: None

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azdo-mcp-wrapper
  namespace: central-services
  labels:
    app: azdo-mcp-wrapper
    project: nova
  annotations:
    # AWS ALB Ingress Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    # IMPORTANT: Replace with your ACM certificate ARN
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:YOUR_ACCOUNT:certificate/YOUR_CERT_ID"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/tags: "Project=Nova,Component=MCP,Environment=Production"
    # Connection timeout for long-lived SSE connections
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  rules:
    # IMPORTANT: Replace with your actual domain
    - host: azdo-mcp.nova.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azdo-mcp-wrapper
                port:
                  number: 80

---
# HorizontalPodAutoscaler for automatic scaling based on CPU/Memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: azdo-mcp-wrapper
  namespace: central-services
  labels:
    app: azdo-mcp-wrapper
    project: nova
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: azdo-mcp-wrapper
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
